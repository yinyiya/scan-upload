<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>出庫單拍照上傳</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f1f1f;--mute:#6b6b6b;--line:#e3e1dc;--accent:#2f6f4f;--accent-ink:#fff;--warn:#b3261e;--ok:#2f6f4f}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#212121;--ink:#eee;--mute:#a0a0a0;--line:#353535;--accent:#5fae86;--accent-ink:#0c1a12;--warn:#ff8a80;--ok:#7fd1a5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.step{font-size:13px;color:var(--mute);margin-bottom:6px}
button,.btn{appearance:none;border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%;cursor:pointer;display:block;text-align:center}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.small{width:auto;padding:6px 10px;font-size:14px;font-weight:500}
button:disabled{opacity:.45}
input[type=text],input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
#cambox{position:relative;margin-bottom:8px;border-radius:10px;overflow:hidden;background:#000}
#video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
#guide{position:absolute;left:8%;right:8%;top:35%;height:30%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
#guide i{position:absolute;left:0;right:0;top:50%;height:2px;background:#ff3b30;animation:sweep 1.6s ease-in-out infinite}
#guide.hit{border-color:#34c759}
@keyframes sweep{0%,100%{top:10%}50%{top:90%}}
#camtools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#camtools button{background:rgba(0,0,0,.55);color:#fff;border-color:rgba(255,255,255,.4)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.5px}
.task{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;cursor:pointer}
.task.sel{border-color:var(--accent);outline:2px solid var(--accent)}
.task .n{font-weight:600}.task .m{font-size:13px;color:var(--mute)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.thumbs div{position:relative}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.thumbs span{position:absolute;right:4px;bottom:4px;font-size:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 5px}
.msg{font-size:14px;margin-top:8px;white-space:pre-wrap}
.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
.hidden{display:none!important}
a{color:var(--accent)}
label{font-size:14px;color:var(--mute);display:block;margin:8px 0 4px}
</style>
</head>
<body>
<h1>出庫單拍照上傳 <button class="small ghost hidden" id="btnAccount">帳號</button></h1>

<div class="card" id="loginCard">
  <div class="step">Asana 帳號</div>
  <div id="loggedOut">
    <button id="btnLogin">用 Asana 帳號登入</button>
    <div class="msg" style="font-size:13px;color:var(--mute)">會在瀏覽器裡打開 Asana 官方登入頁（公司 SSO 也可以），按「允許」就完成；之後會一直保持登入。</div>
    <div class="msg" style="font-size:13px;color:var(--mute)">如果跳到 Asana App 顯示「無法載入內容」：回到這頁，<b>長按</b>下面這個連結 →「在新分頁中打開」。<br><a id="loginLink" href="#">👉 在瀏覽器登入 Asana</a></div>
  </div>
  <div id="loggedIn" class="hidden">
    <div class="row" style="align-items:center">
      <div>已登入：<b id="whoami"></b></div>
      <button class="small ghost" id="btnLogout" style="flex:0 0 auto">登出 / 換帳號</button>
    </div>
  </div>
  <div class="msg" id="loginMsg"></div>
</div>

<div class="card">
  <div class="step">① 掃描出庫單條碼</div>
  <div id="cambox" class="hidden">
    <video id="video" playsinline muted autoplay></video>
    <div id="guide"><i></i></div>
    <div id="camtools">
      <button class="small ghost" id="btnZoom">變焦 1x</button>
      <button class="small ghost hidden" id="btnTorch">🔦 手電筒</button>
    </div>
  </div>
  <input type="file" id="snap" accept="image/*" capture="environment" class="hidden">
  <div class="row">
    <button id="btnScan">開相機掃描</button>
    <button id="btnStop" class="ghost hidden">停止</button>
    <button id="btnSnap" class="ghost">拍照辨識</button>
  </div>
  <div class="msg" style="font-size:13px;color:var(--mute)">把右上角條碼放進框內、距離約 10–15 公分；對不到就按「拍照辨識」。</div>
  <label for="code">或手動輸入單號</label>
  <div class="row"><input type="text" id="code" placeholder="OF2611190013" autocapitalize="characters"><button id="btnFind" style="flex:0 0 80px">查詢</button></div>
  <div class="msg" id="scanMsg"></div>
</div>

<div class="card">
  <div class="step">② Asana 任務</div>
  <div id="tasks" class="msg">尚未查詢</div>
</div>

<div class="card">
  <div class="step">③ 拍照並上傳</div>
  <input type="file" id="cam" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="pick" accept="image/*" multiple class="hidden">
  <div class="row">
    <button id="btnCam">📷 拍照</button>
    <button id="btnPick" class="ghost">從相簿選</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <button id="btnUpload" disabled>上傳到任務</button>
  <div class="msg" id="upMsg"></div>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const API = 'https://app.asana.com/api/1.0';
// ===== 設定（建好 Asana 應用程式與 Cloudflare Worker 後填入） =====
const ASANA_CLIENT_ID = '1220734431533437';
const AUTH_SERVER = 'https://scan-upload-auth.qwe871126.workers.dev';
const REDIRECT_URI = 'https://yinyiya.github.io/scan-upload/';
const SCOPES = 'tasks:read attachments:write users:read stories:read stories:write';
const WORKSPACE = '1207521339934269';
const PROJECT = '1209208905247931';            // 門市-倉儲
// =================================================================
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const cfg = { ws: WORKSPACE, proj: PROJECT };
let selectedTask = null;
let photos = []; // {blob, url}

function setMsg(id, text, cls){ const el = $(id); el.textContent = text; el.className = 'msg' + (cls ? ' ' + cls : ''); }

// ---------- Asana 登入（OAuth + PKCE，密鑰放在 Cloudflare Worker） ----------
function getAuth(){
  let a = null;
  try { a = JSON.parse(store.get('asana_auth', 'null')); } catch(e){}
  // 權限範圍改過時，舊的登入要重新來一次
  if (a && a.scopes !== SCOPES){ store.del('asana_auth'); a = null; }
  return a;
}
function saveAuth(a){ store.set('asana_auth', JSON.stringify(a)); }
function b64url(bytes){ return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function randStr(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }

function showLogin(){
  const a = getAuth();
  $('loggedOut').classList.toggle('hidden', !!a);
  $('loggedIn').classList.toggle('hidden', !a);
  $('btnAccount').classList.toggle('hidden', !a);
  $('loginCard').classList.toggle('hidden', !!a && !showLogin.open);
  if (a) $('whoami').textContent = a.name || '（已登入）';
}
$('btnAccount').onclick = () => { showLogin.open = !showLogin.open; showLogin(); };

// 預先產生登入網址（PKCE），按鈕與備用連結共用同一組
let loginUrl = null;
async function prepareLogin(){
  const verifier = randStr(48);
  const state = randStr(16);
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  store.set('pkce_verifier', verifier);
  store.set('oauth_state', state);
  const q = new URLSearchParams({
    client_id: ASANA_CLIENT_ID, redirect_uri: REDIRECT_URI, response_type: 'code',
    state, code_challenge_method: 'S256', code_challenge: b64url(digest), scope: SCOPES
  });
  loginUrl = 'https://app.asana.com/-/oauth_authorize?' + q.toString().replace(/\+/g, '%20');
  $('loginLink').href = loginUrl;
  return loginUrl;
}
// iPhone 有裝 Asana App 時，直接點 app.asana.com 的連結會被 App 攔走（App 打不開登入頁）。
// 所以先跳到自己的頁面（?go=1），再由頁面自動轉到 Asana —— 非手指點擊的轉址不會被 App 攔截。
$('btnLogin').onclick = async () => {
  const url = loginUrl || await prepareLogin();
  store.set('auth_go', url);
  location.href = REDIRECT_URI + '?go=1';
};

async function authCall(path, body){
  const r = await fetch(AUTH_SERVER + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error_description || d.error || ('HTTP ' + r.status));
  return d;
}

// 從 Asana 登入頁回來時（網址帶 ?code=...）
async function handleRedirect(){
  const u = new URL(location.href);
  const code = u.searchParams.get('code'), err = u.searchParams.get('error'), state = u.searchParams.get('state');
  if (!code && !err) return;
  history.replaceState(null, '', REDIRECT_URI);
  if (err){ setMsg('loginMsg', '登入取消或失敗：' + err, 'err'); return; }
  if (state !== store.get('oauth_state', '')){ setMsg('loginMsg', '登入驗證不符，請再按一次登入', 'err'); return; }
  setMsg('loginMsg', '登入中…');
  try {
    const d = await authCall('/token', { code, code_verifier: store.get('pkce_verifier', '') });
    saveAuth({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000, name: d.name, scopes: SCOPES });
    setMsg('loginMsg', '');
  } catch(e){ setMsg('loginMsg', '登入失敗：' + e.message, 'err'); }
  store.del('pkce_verifier'); store.del('oauth_state');
}

let refreshing = null;
async function refreshToken(){
  const a = getAuth(); if (!a || !a.refresh_token) throw new Error('請先登入 Asana');
  if (!refreshing){
    refreshing = authCall('/refresh', { refresh_token: a.refresh_token })
      .then(d => { saveAuth({ ...a, access_token: d.access_token, refresh_token: d.refresh_token || a.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000 }); })
      .catch(e => { if (/invalid_grant|unauthorized/i.test(e.message)) { store.del('asana_auth'); showLogin(); throw new Error('登入已失效，請重新登入 Asana'); } throw e; })
      .finally(() => { refreshing = null; });
  }
  return refreshing;
}
async function accessToken(){
  const a = getAuth(); if (!a) { showLogin(); throw new Error('請先登入 Asana'); }
  if (Date.now() > a.expires_at - 60000) await refreshToken();
  return getAuth().access_token;
}

$('btnLogout').onclick = async () => {
  const a = getAuth();
  store.del('asana_auth');
  showLogin.open = false; showLogin();
  if (a && a.refresh_token) { try { await authCall('/revoke', { refresh_token: a.refresh_token }); } catch(e){} }
  setMsg('loginMsg', '已登出。要換帳號：按登入後，在 Asana 頁面切換或登出原帳號。', 'ok');
};

async function asana(path, opts = {}, retried){
  const tok = await accessToken();
  const res = await fetch(API + path, { ...opts, headers: { Authorization: 'Bearer ' + tok, ...(opts.headers || {}) } });
  if (res.status === 401 && !retried){ await refreshToken(); return asana(path, opts, true); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((body.errors && body.errors[0] && body.errors[0].message) || ('HTTP ' + res.status));
  return body;
}
(function boot(){
  const u = new URL(location.href);
  if (u.searchParams.get('go') === '1'){
    const go = store.get('auth_go', '');
    store.del('auth_go');
    if (go.startsWith('https://app.asana.com/-/oauth_authorize?')){ location.replace(go); return; }
    history.replaceState(null, '', REDIRECT_URI);
  }
  handleRedirect().finally(() => { showLogin(); if (!getAuth()) prepareLogin(); });
})();

// ---------- scanning ----------
// 引擎：手機有原生 BarcodeDetector（多數 Android Chrome）就用原生（最快）；否則用 ZXing。
// 加速重點：只解框內區域（原解析度裁切）、自動變焦 2x、連續對焦、每格輪流兩種二值化 + 偶爾解全畫面。
function cleanCode(t){ return (t || '').trim().toUpperCase(); }
function isOrderCode(t){ return t.length >= 6 && !/^\d+$/.test(t); } // 商品條碼是純數字，略過
const ZF = ZXing.BarcodeFormat;
// 即時掃描用「快速」讀取器（只認 1D 條碼、不開 TRY_HARDER → 每秒可試很多次）；拍照辨識用「仔細」讀取器
const zx = {};
function zxReader(hard){
  const k = hard ? 'hard' : 'fast';
  if (!zx[k]){
    zx[k] = new ZXing.MultiFormatReader();
    const h = new Map();
    h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, hard ? [ZF.CODE_128, ZF.CODE_39, ZF.CODE_93, ZF.ITF, ZF.QR_CODE] : [ZF.CODE_128, ZF.CODE_39]);
    if (hard) h.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zx[k].setHints(h);
  }
  return zx[k];
}
function zxDecode(canvas, alt, hard = true){
  try {
    const lum = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    const bin = alt ? new ZXing.GlobalHistogramBinarizer(lum) : new ZXing.HybridBinarizer(lum);
    return zxReader(hard).decodeWithState(new ZXing.BinaryBitmap(bin)).getText();
  } catch(e){ return null; }
}
let native; // undefined = 還沒檢查, null = 沒有
async function getNative(){
  if (native !== undefined) return native;
  native = null;
  try {
    if ('BarcodeDetector' in window){
      const sup = await BarcodeDetector.getSupportedFormats();
      const want = ['code_128','code_39','code_93','itf','qr_code'].filter(f => sup.includes(f));
      if (want.includes('code_128')) native = new BarcodeDetector({ formats: want });
    }
  } catch(e){}
  return native;
}
async function nativeDecode(src){
  try { const r = await native.detect(src); const hit = r.map(x => cleanCode(x.rawValue)).find(isOrderCode); return hit || null; }
  catch(e){ return null; }
}

const video = $('video'), guide = $('guide');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });
let stream = null, track = null, scanning = false, frame = 0;
let zoomLevels = [1], zoomIdx = 0, hwZoom = false, digitalZoom = 1, torchOn = false;

// 把畫面上的框換算成影片原始像素座標（object-fit: cover + 數位變焦）
function guideRectInVideo(pad){
  const vw = video.videoWidth, vh = video.videoHeight;
  const cw = video.clientWidth, ch = video.clientHeight;
  const s = Math.max(cw / vw, ch / vh) * digitalZoom;
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const g = guide.getBoundingClientRect(), v = video.getBoundingClientRect();
  let x = (g.left - v.left - ox) / s, y = (g.top - v.top - oy) / s, w = g.width / s, h = g.height / s;
  x -= w * pad; y -= h * pad; w *= 1 + 2 * pad; h *= 1 + 2 * pad;
  x = Math.max(0, x); y = Math.max(0, y); w = Math.min(vw - x, w); h = Math.min(vh - y, h);
  return { x, y, w, h };
}
function drawToWork(sx, sy, sw, sh, maxW){
  // 條碼太小時放大 2 倍（細線條比較好判讀）
  const k = Math.min(sw < 700 ? 2 : 1, maxW / sw);
  wctx.imageSmoothingQuality = 'high';
  work.width = Math.round(sw * k); work.height = Math.round(sh * k);
  wctx.drawImage(video, sx, sy, sw, sh, 0, 0, work.width, work.height);
}

async function tick(){
  if (!video.videoWidth) return null;
  frame++;
  if (native){
    // 原生偵測很快，直接整個畫面
    return await nativeDecode(video);
  }
  if (frame % 4 === 0){
    // 每 4 格解一次全畫面（條碼不在框內也有機會）
    drawToWork(0, 0, video.videoWidth, video.videoHeight, 1280);
  } else {
    const r = guideRectInVideo(0.15);
    drawToWork(r.x, r.y, r.w, r.h, 1400);
  }
  // 大部分用快速模式；每 6 格用一次仔細模式
  const t = zxDecode(work, frame % 2 === 1, frame % 6 === 5);
  return t && isOrderCode(cleanCode(t)) ? cleanCode(t) : null;
}

async function scanLoop(){
  while (scanning){
    const t0 = performance.now();
    const hit = await tick();
    if (hit){ onCode(hit); return; }
    const spent = performance.now() - t0;
    await new Promise(r => setTimeout(r, Math.max(10, 60 - spent)));
  }
}

let audioCtx = null;
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 1400; g.gain.value = 0.15; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.12);
  } catch(e){}
}
function onCode(t){
  guide.classList.add('hit');
  beep(); if (navigator.vibrate) navigator.vibrate(80);
  setTimeout(stopScan, 250);
  $('code').value = t;
  setMsg('scanMsg', '掃到單號：' + t, 'ok');
  findTask(t);
}

async function applyZoom(){
  const z = zoomLevels[zoomIdx];
  if (hwZoom){ try { await track.applyConstraints({ advanced: [{ zoom: z }] }); } catch(e){} }
  else { digitalZoom = z; video.style.transform = 'scale(' + z + ')'; }
  $('btnZoom').textContent = '變焦 ' + z + 'x';
}
$('btnZoom').onclick = () => { zoomIdx = (zoomIdx + 1) % zoomLevels.length; applyZoom(); };
$('btnTorch').onclick = async () => {
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch(e){}
  $('btnTorch').textContent = torchOn ? '🔦 關燈' : '🔦 手電筒';
};
// 點畫面重新對焦
video.onclick = async () => {
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }); } catch(e){}
  setTimeout(() => { try { track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch(e){} }, 600);
};

$('btnScan').onclick = async () => {
  setMsg('scanMsg', '');
  try {
    if (audioCtx === null) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    await getNative();
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }
    }});
    track = stream.getVideoTracks()[0];
    video.srcObject = stream;
    $('cambox').classList.remove('hidden');
    guide.classList.remove('hit');
    await video.play();
    const caps = (track.getCapabilities && track.getCapabilities()) || {};
    if (caps.focusMode && caps.focusMode.includes('continuous')){
      try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch(e){}
    }
    if (caps.zoom && caps.zoom.max >= 1.5){
      hwZoom = true;
      const lo = caps.zoom.min || 1;
      zoomLevels = [lo, 2, 3].filter(z => z >= lo && z <= caps.zoom.max);
      zoomIdx = zoomLevels.indexOf(2) >= 0 ? zoomLevels.indexOf(2) : 0;
    } else {
      hwZoom = false; zoomLevels = [1, 1.5, 2]; zoomIdx = 1;
    }
    await applyZoom();
    $('btnTorch').classList.toggle('hidden', !caps.torch);
    $('btnScan').classList.add('hidden'); $('btnStop').classList.remove('hidden');
    scanning = true; frame = 0;
    scanLoop();
  } catch(e){
    stopScan();
    setMsg('scanMsg', '無法開啟相機：' + e.message + '\n（需用 https 網址開啟，並允許相機權限；也可按「拍照辨識」或手動輸入單號）', 'err');
  }
};
function stopScan(){
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null; torchOn = false;
  video.srcObject = null; video.style.transform = '';
  $('btnTorch').textContent = '🔦 手電筒';
  $('cambox').classList.add('hidden');
  $('btnScan').classList.remove('hidden'); $('btnStop').classList.add('hidden');
}
$('btnStop').onclick = stopScan;

// ---------- 拍照辨識：用手機相機拍一張高解析照片再解（最穩，對焦交給相機 App） ----------
$('btnSnap').onclick = () => $('snap').click();
$('snap').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  stopScan();
  setMsg('scanMsg', '辨識中…');
  try {
    const img = await loadImage(f);
    const t = await decodeImage(img);
    if (t) onCode(t);
    else setMsg('scanMsg', '照片裡找不到出庫單號條碼。請靠近一點、讓條碼清楚且水平再拍一次，或手動輸入。', 'err');
  } catch(err){ setMsg('scanMsg', '辨識失敗：' + err.message, 'err'); }
};
function loadImage(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('無法讀取照片'));
    img.src = URL.createObjectURL(file);
  });
}
function cropTo(img, sx, sy, sw, sh, maxW, rotate){
  const k = Math.min(1, maxW / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k);
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d', { willReadFrequently: true });
  if (rotate){ c.width = h; c.height = w; ctx.translate(h, 0); ctx.rotate(Math.PI / 2); }
  else { c.width = w; c.height = h; }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return c;
}
async function decodeImage(img){
  const W = img.naturalWidth, H = img.naturalHeight;
  await getNative();
  // 候選區域：整張、右上、各個重疊格（條碼在出庫單右上角，小）
  const regions = [[0, 0, W, H], [W * 0.4, 0, W * 0.6, H * 0.35]];
  for (const n of [2, 3]){
    const cw = W / n * 1.5, chh = H / n * 1.5;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){
      regions.push([Math.min(W - cw, i * W / n), Math.min(H - chh, j * H / n), Math.min(cw, W), Math.min(chh, H)].map(v => Math.max(0, v)));
    }
  }
  for (const rot of [false, true]){
    for (const [x, y, w, h] of (rot ? regions.slice(0, 6) : regions)){
      const c = cropTo(img, x, y, w, h, 1800, rot);
      if (native){ const t = await nativeDecode(c); if (t) return t; }
      for (const alt of [false, true]){
        const t = zxDecode(c, alt);
        if (t && isOrderCode(cleanCode(t))) return cleanCode(t);
      }
      await new Promise(r => setTimeout(r, 0)); // 讓畫面不卡
    }
  }
  return null;
}
$('btnFind').onclick = () => { const t = cleanCode($('code').value); if (t) findTask(t); };
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnFind').click(); });

// ---------- find task ----------
// 先用 Asana 搜尋（實測會比對到留言內容）；找不到再逐一翻近 60 天任務的留言
function renderTasks(list, code){
  const box = $('tasks');
  box.innerHTML = ''; box.className = '';
  list.forEach(t => {
    const d = document.createElement('div');
    d.className = 'task';
    d.innerHTML = '<div class="n"></div><div class="m"></div>';
    d.querySelector('.n').textContent = t.name + (t.completed ? '（已完成）' : '');
    const a = document.createElement('a'); a.href = t.permalink_url; a.target = '_blank'; a.textContent = '在 Asana 開啟';
    a.onclick = e => e.stopPropagation();
    d.querySelector('.m').appendChild(a);
    d.onclick = () => { selectedTask = t; [...box.querySelectorAll('.task')].forEach(c => c.classList.remove('sel')); d.classList.add('sel'); updateUploadBtn(); };
    box.appendChild(d);
  });
  if (list.length === 1) box.querySelector('.task').click();
  else { const n = document.createElement('div'); n.className = 'msg'; n.textContent = '找到 ' + list.length + ' 筆含有 ' + code + ' 的任務，請點選正確的那一筆'; box.prepend(n); }
}
async function searchByComments(code, onProgress){
  const since = new Date(Date.now() - 60 * 864e5).toISOString();
  const r = await asana('/projects/' + cfg.proj + '/tasks?' + new URLSearchParams({ completed_since: since, opt_fields: 'name,completed,permalink_url,modified_at', limit: '100' }));
  const tasks = (r.data || []).sort((a, b) => (b.modified_at || '').localeCompare(a.modified_at || ''));
  const hits = [];
  for (let i = 0; i < tasks.length && !hits.length; i += 6){
    onProgress(i, tasks.length);
    await Promise.all(tasks.slice(i, i + 6).map(async t => {
      const s = await asana('/tasks/' + t.gid + '/stories?' + new URLSearchParams({ opt_fields: 'text,resource_subtype', limit: '100' }));
      if ((s.data || []).some(x => x.resource_subtype === 'comment_added' && (x.text || '').toUpperCase().includes(code))) hits.push(t);
    }));
  }
  return hits;
}
async function findTask(code){
  selectedTask = null; updateUploadBtn();
  const box = $('tasks');
  box.className = 'msg'; box.textContent = '在 Asana 搜尋 ' + code + ' …';
  try {
    const q = new URLSearchParams({
      text: code, 'projects.any': cfg.proj,
      opt_fields: 'name,completed,permalink_url', sort_by: 'modified_at', limit: '20'
    });
    let list = (await asana('/workspaces/' + cfg.ws + '/tasks/search?' + q)).data || [];
    if (!list.length){
      list = await searchByComments(code, (i, n) => { box.textContent = '逐一檢查任務留言中… ' + i + ' / ' + n; });
    }
    if (!list.length){ box.className = 'msg err'; box.textContent = '在「門市-倉儲」近 60 天的任務留言裡找不到 ' + code + '。請確認單號，或手動在 Asana 找到任務。'; return; }
    renderTasks(list, code);
  } catch(e){ box.className = 'msg err'; box.textContent = '搜尋失敗：' + e.message; }
}

// ---------- photos ----------
$('btnCam').onclick = () => $('cam').click();
$('btnPick').onclick = () => $('pick').click();
$('cam').onchange = e => addFiles(e.target.files, e.target);
$('pick').onchange = e => addFiles(e.target.files, e.target);

async function addFiles(files, input){
  for (const f of files){
    try { const blob = await shrink(f); photos.push({ blob, url: URL.createObjectURL(blob) }); }
    catch(err){ setMsg('upMsg', '讀取照片失敗：' + err.message, 'err'); }
  }
  input.value = '';
  renderThumbs(); updateUploadBtn();
}
// 縮到長邊 2000px、JPEG，讓上傳快一點
function shrink(file, max = 2000){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? resolve(b) : reject(new Error('轉檔失敗')), 'image/jpeg', 0.85);
    };
    img.onerror = () => reject(new Error('無法讀取圖片'));
    img.src = URL.createObjectURL(file);
  });
}
function renderThumbs(){
  const box = $('thumbs'); box.innerHTML = '';
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    d.innerHTML = '<img alt=""><span>✕</span>';
    d.querySelector('img').src = p.url;
    d.querySelector('span').onclick = () => { URL.revokeObjectURL(p.url); photos.splice(i, 1); renderThumbs(); updateUploadBtn(); };
    box.appendChild(d);
  });
}
function updateUploadBtn(){
  $('btnUpload').disabled = !(selectedTask && photos.length);
  $('btnUpload').textContent = selectedTask ? ('上傳 ' + photos.length + ' 張到「' + selectedTask.name + '」') : '上傳到任務（先選任務）';
}

// ---------- upload：照片傳成附件，再在任務底下留一則留言（含照片） ----------
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function postPhotoComment(task, code, atts){
  const head = '📷 出庫照片 ' + atts.length + ' 張' + (code !== 'PHOTO' ? '（單號 ' + esc(code) + '）' : '');
  const post = html => asana('/tasks/' + task.gid + '/stories', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data: { html_text: '<body>' + html + '</body>' } })
  });
  try {
    // 先試留言內直接顯示照片
    await post(head + '\n' + atts.map(a => '<img data-asana-gid="' + a.gid + '"/>').join(''));
  } catch(e){
    if (/scope/i.test(e.message)) throw e;
    // Asana 不接受留言內嵌圖片時，改成照片連結
    await post(head + '\n' + atts.map((a, i) => '<a href="' + esc(a.permanent_url || a.view_url || '') + '">照片 ' + (i + 1) + '</a>').join('\n'));
  }
}
$('btnUpload').onclick = async () => {
  const task = selectedTask; if (!task || !photos.length) return;
  $('btnUpload').disabled = true;
  const code = cleanCode($('code').value) || 'PHOTO';
  const stamp = new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');
  const atts = [];
  for (let i = 0; i < photos.length; i++){
    setMsg('upMsg', '上傳中 ' + (i + 1) + ' / ' + photos.length + ' …');
    const fd = new FormData();
    fd.append('parent', task.gid);
    fd.append('file', photos[i].blob, code + '_' + stamp + '_' + (i + 1) + '.jpg');
    try { const r = await asana('/attachments?opt_fields=permanent_url,view_url', { method: 'POST', body: fd }); atts.push(r.data); }
    catch(e){
      setMsg('upMsg', '第 ' + (i + 1) + ' 張上傳失敗：' + e.message + '\n已成功 ' + atts.length + ' 張；失敗的照片仍保留，可再按一次上傳。', 'err');
      photos.splice(0, atts.length).forEach(p => URL.revokeObjectURL(p.url));
      renderThumbs(); updateUploadBtn(); return;
    }
  }
  photos.forEach(p => URL.revokeObjectURL(p.url)); photos = [];
  renderThumbs(); updateUploadBtn();
  setMsg('upMsg', '照片已上傳，正在留言…');
  try {
    await postPhotoComment(task, code, atts);
    setMsg('upMsg', '✅ 已上傳 ' + atts.length + ' 張，並在「' + task.name + '」底下留言', 'ok');
  } catch(e){
    setMsg('upMsg', '照片已上傳成附件（' + atts.length + ' 張），但留言失敗：' + e.message + (/scope/i.test(e.message) ? '\n請按右上「帳號」→ 登出，再重新登入一次。' : ''), 'err');
  }
};
updateUploadBtn();
</script>
